coverage:
  status:
    project:
      default:
        # Current baseline: the BLE link itself is only exercised against a real thermometer
        target: 40%
        # Allow 5% drop before failing
        threshold: 5%
    patch:
      default:
        # New code should have at least 60% coverage
        target: 60%

comment:
  # Post coverage report as PR comment
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
